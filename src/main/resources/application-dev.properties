# Development profile: fail fast and keep retries short.
app.kafka.retry.max-attempts=${APP_KAFKA_RETRY_MAX_ATTEMPTS:2}
app.kafka.retry.backoff-ms=${APP_KAFKA_RETRY_BACKOFF_MS:200}

app.outbox.retry.enabled=${APP_OUTBOX_RETRY_ENABLED:true}
app.outbox.retry.max-attempts=${APP_OUTBOX_RETRY_MAX_ATTEMPTS:3}
app.outbox.retry.backoff-ms=${APP_OUTBOX_RETRY_BACKOFF_MS:500}
app.outbox.retry.poll-ms=${APP_OUTBOX_RETRY_POLL_MS:2000}
app.outbox.retry.batch-size=${APP_OUTBOX_RETRY_BATCH_SIZE:50}

