services:
  postgres:
    image: postgres:16
    container_name: fidstp2-postgres
    environment:
      POSTGRES_DB: fidstp2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fidstp2"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  counterparty-db:
    image: postgres:16
    container_name: counterparty-db
    environment:
      POSTGRES_DB: counterparty_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - counterparty_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d counterparty_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  currency-pair-db:
    image: postgres:16
    container_name: currency-pair-db
    environment:
      POSTGRES_DB: currency_pair_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - currency_pair_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d currency_pair_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: fidstp2-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: fidstp2-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      '
       /usr/bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic fx.option.trade.raw --partitions 1 --replication-factor 1 &&
       /usr/bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic fx.option.trade.processed --partitions 1 --replication-factor 1 &&
       /usr/bin/kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic fx.option.trade.dlq --partitions 1 --replication-factor 1
       '
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fidstp2-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fidstp2-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092

  counterparty-service:
    build:
      context: ./counterparty-service
      dockerfile: Dockerfile
    container_name: counterparty-service
    depends_on:
      counterparty-db:
        condition: service_healthy
    ports:
      - "8888:8888"
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://counterparty-db:5432/counterparty_db
    restart: unless-stopped

  currency-pair-service:
    build:
      context: ./currency-pair-service
      dockerfile: Dockerfile
    container_name: currency-pair-service
    depends_on:
      currency-pair-db:
        condition: service_healthy
    ports:
      - "8889:8889"
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://currency-pair-db:5432/currency_pair_db
    restart: unless-stopped

  fidstp2-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fidstp2-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      counterparty-service:
        condition: service_started
      currency-pair-service:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fidstp2
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ENRICHMENT_COUNTERPARTY_REMOTE_ENABLED: "true"
      ENRICHMENT_COUNTERPARTY_REMOTE_BASE_URL: http://counterparty-service:8888
      ENRICHMENT_CURRENCY_PAIR_REMOTE_ENABLED: "true"
      ENRICHMENT_CURRENCY_PAIR_REMOTE_BASE_URL: http://currency-pair-service:8889
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  counterparty_db_data:
  currency_pair_db_data:

