spring.application.name=fidstp2

# Foundation defaults; override with env vars in each environment.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fidstp2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:fidstp2-consumer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.inbound-topic=${KAFKA_INBOUND_TOPIC:fx.option.trade.raw}
app.kafka.outbound-topic=${KAFKA_OUTBOUND_TOPIC:fx.option.trade.processed}
app.kafka.dlq-topic=${KAFKA_DLQ_TOPIC:fx.option.trade.dlq}
app.kafka.listener.enabled=${APP_KAFKA_LISTENER_ENABLED:true}

spring.flyway.enabled=true

# Enrichment configuration: set to "true" to use remote microservice, "false" for local DB
enrichment.counterparty.remote.enabled=${ENRICHMENT_COUNTERPARTY_REMOTE_ENABLED:false}
enrichment.counterparty.remote.base-url=${ENRICHMENT_COUNTERPARTY_REMOTE_BASE_URL:http://localhost:8888}
