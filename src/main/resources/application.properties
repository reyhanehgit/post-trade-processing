spring.application.name=fidstp2
logging.file.name=${LOGGING_FILE_NAME:/app/logs/fidstp2-app.log}

# Foundation defaults; override with env vars in each environment.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/fidstp2}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:${KAFKA_GROUP_ID:fidstp2-consumer}}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.inbound-topic=${KAFKA_INBOUND_TOPIC:fx.option.trade.raw}
app.kafka.outbound-topic=${KAFKA_OUTBOUND_TOPIC:fx.option.trade.processed}
app.kafka.dlq-topic=${KAFKA_DLQ_TOPIC:fx.option.trade.dlq}
app.kafka.listener.enabled=${APP_KAFKA_LISTENER_ENABLED:true}
app.kafka.retry.max-attempts=${APP_KAFKA_RETRY_MAX_ATTEMPTS:3}
app.kafka.retry.backoff-ms=${APP_KAFKA_RETRY_BACKOFF_MS:500}

app.outbox.retry.enabled=${APP_OUTBOX_RETRY_ENABLED:true}
app.outbox.retry.max-attempts=${APP_OUTBOX_RETRY_MAX_ATTEMPTS:5}
app.outbox.retry.backoff-ms=${APP_OUTBOX_RETRY_BACKOFF_MS:1000}
app.outbox.retry.poll-ms=${APP_OUTBOX_RETRY_POLL_MS:5000}
app.outbox.retry.batch-size=${APP_OUTBOX_RETRY_BATCH_SIZE:100}

spring.flyway.enabled=true

# Enrichment configuration: set to "true" to use remote microservice, "false" for local DB
enrichment.counterparty.remote.enabled=${ENRICHMENT_COUNTERPARTY_REMOTE_ENABLED:true}
enrichment.counterparty.remote.base-url=${ENRICHMENT_COUNTERPARTY_REMOTE_BASE_URL:http://localhost:8888}
enrichment.counterparty.cache.max-size=${ENRICHMENT_COUNTERPARTY_CACHE_MAX_SIZE:10000}
enrichment.counterparty.cache.ttl-minutes=${ENRICHMENT_COUNTERPARTY_CACHE_TTL_MINUTES:30}
enrichment.counterparty.cache.preload-all=${ENRICHMENT_COUNTERPARTY_CACHE_PRELOAD_ALL:true}
enrichment.counterparty.cache.preload-ids=${ENRICHMENT_COUNTERPARTY_CACHE_PRELOAD_IDS:}

enrichment.currency-pair.remote.enabled=${ENRICHMENT_CURRENCY_PAIR_REMOTE_ENABLED:true}
enrichment.currency-pair.remote.base-url=${ENRICHMENT_CURRENCY_PAIR_REMOTE_BASE_URL:http://localhost:8889}
enrichment.currency-pair.cache.max-size=${ENRICHMENT_CURRENCY_PAIR_CACHE_MAX_SIZE:10000}
enrichment.currency-pair.cache.ttl-minutes=${ENRICHMENT_CURRENCY_PAIR_CACHE_TTL_MINUTES:30}
enrichment.currency-pair.cache.preload-all=${ENRICHMENT_CURRENCY_PAIR_CACHE_PRELOAD_ALL:true}
enrichment.currency-pair.cache.preload-ids=${ENRICHMENT_CURRENCY_PAIR_CACHE_PRELOAD_IDS:}


